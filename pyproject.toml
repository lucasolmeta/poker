[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Poker-Equity-Engine"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["."]